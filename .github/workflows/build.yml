name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bouw:
    name: ${{ matrix.naam }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Afhankelijkheden
        run: python -m pip install --upgrade pip pyinstaller requests
      - name: Bouwen
        run: pyinstaller --noconfirm --clean build.spec
      - name: Rooktest (programma starten en pagina ophalen)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          if [ -f dist/padel-configurator.exe ]; then BIN=dist/padel-configurator.exe; else BIN=dist/padel-configurator; fi
          VERSIE=$(python -c "import re;print(re.search(r'VERSIE = \"([0-9.]+)\"', open('configureer.py').read()).group(1))")
          echo "getest wordt $BIN, versie $VERSIE"
          python scripts/rooktest.py "$BIN" --verwacht "$VERSIE"
      - name: Naam geven
        shell: bash
        run: |
          mkdir -p uit
          if [ -f dist/padel-configurator.exe ]; then
            cp dist/padel-configurator.exe "uit/padel-configurator-${{ matrix.naam }}.exe"
          else
            cp dist/padel-configurator "uit/padel-configurator-${{ matrix.naam }}"
          fi
      - name: macOS .app-bundel (dubbelklikbaar)
        if: matrix.naam == 'macos-arm64'
        env:
          PYTHONUTF8: "1"
        run: |
          pyinstaller --noconfirm --clean --windowed --name padel-configurator \
            --add-data "Starthier.html:." --add-data "template_book_padel.py:." \
            --distpath dist-app --workpath build-app configureer.py
          VERSIE=$(python -c "import re;print(re.search(r'VERSIE = \"([0-9.]+)\"', open('configureer.py').read()).group(1))")
          PADEL_LOG="$PWD/app.log" python scripts/rooktest.py \
            "dist-app/padel-configurator.app/Contents/MacOS/padel-configurator" \
            --verwacht "$VERSIE" --logbestand "$PWD/app.log"
          ditto -c -k --keepParent "dist-app/padel-configurator.app" "uit/padel-configurator-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.naam }}
          path: uit/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: uit/*
          body: |
            Zelfstandige configurator voor de baantjes-reservering.

            | bestand | platform |
            |---|---|
            | `padel-configurator-windows.exe` | Windows 10/11 |
            | `padel-configurator-macos-intel` | Mac met Intel-processor |
            | `padel-configurator-macos-arm64` | Mac met Apple-chip (M1 en nieuwer) |
            | `padel-configurator-linux` | Linux (x86_64) |

            Uitvoeren en de URL openen die in het venster verschijnt. Zie README.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, naam: windows }
          - { os: macos-15-intel, naam: macos-intel }
          - { os: macos-15, naam: macos-arm64 }
          - { os: ubuntu-latest, naam: linux }

  app:
    name: macos-app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Afhankelijkheden
        run: python -m pip install --upgrade pip pyinstaller requests
      - name: Bouwen als app-bundel
        run: >
          pyinstaller --windowed --noconfirm --clean --name padel-configurator
          --add-data "Starthier.html:." --add-data "template_book_padel.py:."
          configureer.py
      - name: Rooktest (app starten, URL uit logbestand)
        env:
          PYTHONUTF8: "1"
        run: |
          VERSIE=$(python -c "import re;print(re.search(r'VERSIE = \"([0-9.]+)\"', open('configureer.py').read()).group(1))")
          export PADEL_LOG="$RUNNER_TEMP/padel-app.log"
          python scripts/rooktest.py "dist/padel-configurator.app/Contents/MacOS/padel-configurator" \
            --verwacht "$VERSIE" --log "$PADEL_LOG"
      - name: Zippen (app-bundel is een map)
        run: |
          mkdir -p uit
          ditto -c -k --sequesterRsrc --keepParent "dist/padel-configurator.app" \
            "uit/padel-configurator-macos-arm64.zip"
      - name: macOS .app-bundel (dubbelklikbaar)
        if: matrix.naam == 'macos-arm64'
        env:
          PYTHONUTF8: "1"
        run: |
          pyinstaller --noconfirm --clean --windowed --name padel-configurator \
            --add-data "Starthier.html:." --add-data "template_book_padel.py:." \
            --distpath dist-app --workpath build-app configureer.py
          VERSIE=$(python -c "import re;print(re.search(r'VERSIE = \"([0-9.]+)\"', open('configureer.py').read()).group(1))")
          PADEL_LOG="$PWD/app.log" python scripts/rooktest.py \
            "dist-app/padel-configurator.app/Contents/MacOS/padel-configurator" \
            --verwacht "$VERSIE" --logbestand "$PWD/app.log"
          ditto -c -k --keepParent "dist-app/padel-configurator.app" "uit/padel-configurator-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: uit/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: uit/*
